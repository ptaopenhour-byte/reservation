                    <Icon name="triangle-exclamation" />
                    <h2>Unable to connect</h2>
                    <p>The sign-in service is unavailable. Please try again or contact the administrator.</p>
                    <button className="ui-button" onClick={() => window.location.reload()}>Try again</button>
                </div></div>;
            }

            if (!firebaseReady) {
                return <div className="auth-shell"><div className="auth-content" role="status">
                    <span className="brand-symbol"><Icon name="laptop" /></span>
                    <h2>IBSH Carts</h2><p><Icon name="spinner" className="fa-solid fa-spinner fa-spin" /> Connecting...</p>
                </div></div>;
            }

            if (!currentUser && !isAdmin) {
                return <div className="auth-shell"><div className="auth-content">
                    <span className="brand-symbol"><Icon name="laptop" /></span>
                    <h1>IBSH Carts</h1><p>Equipment reservations</p>
                    <p>Sign in with your authorized school Google account.</p>
                    <button onClick={handleGoogleLogin} className="ui-button google-login">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" />
                        Sign in with Google
                    </button>
                    {alertModal.isOpen && <div className="auth-error" role="alert">{alertModal.message}</div>}
                </div></div>;
            }

            return (
                <div className={`app-shell ${bookingModal.isOpen ? 'has-booking' : ''}`}>
                    {sidebarOpen && <button className="sidebar-backdrop no-print" aria-label="Close equipment menu" onClick={() => setSidebarOpen(false)} />}
                    <aside ref={sidebarRef} className={`sidebar no-print ${sidebarOpen ? 'open' : ''}`} aria-label="Equipment navigation"
                        role={mobileViewport && sidebarOpen ? 'dialog' : undefined} aria-modal={mobileViewport && sidebarOpen ? true : undefined}
                        inert={((mobileViewport && !sidebarOpen) || (bookingModal.isOpen && compactViewport)) ? '' : undefined}
                        onKeyDown={event => {
                            if (event.key === 'Escape') setSidebarOpen(false);
                            if (event.key === 'Tab' && mobileViewport && sidebarOpen) {
                                const items = [...sidebarRef.current.querySelectorAll('button, input, select')].filter(item => !item.disabled && item.getClientRects().length);
                                if (event.shiftKey && document.activeElement === items[0]) { event.preventDefault(); items.at(-1)?.focus(); }
                                else if (!event.shiftKey && document.activeElement === items.at(-1)) { event.preventDefault(); items[0]?.focus(); }
                            }
                        }}>
                        <IconButton label="Close navigation" name="xmark" className="quiet sidebar-close" onClick={() => setSidebarOpen(false)} />
                        <button className="brand" onClick={goHome} disabled={isSaving}>
                            <span className="brand-symbol"><Icon name="laptop" /></span>
                            <span><strong>IBSH Carts</strong><small>Equipment reservations</small></span>
                        </button>
                        <nav className="sidebar-nav">
                            <button className={`nav-item ${currentView === 'schedule' ? 'active' : ''}`} aria-current={currentView === 'schedule' ? 'page' : undefined} onClick={goHome} disabled={isSaving}><Icon name="calendar-days" /><span>Schedule</span></button>
                            <button className={`nav-item ${currentView === 'my-bookings' ? 'active' : ''}`} aria-current={currentView === 'my-bookings' ? 'page' : undefined} onClick={() => changeView('my-bookings')} disabled={isSaving}><Icon name="calendar-check" /><span>My bookings</span></button>
                        </nav>
                        <div className="equipment-list">
                            <label className="equipment-search"><Icon name="magnifying-glass" /><input aria-label="Search equipment" placeholder="Search equipment" value={searchQuery} onChange={event => setSearchQuery(event.target.value)} /></label>
                            {locations.length > 2 && <select className="location-select" aria-label="Filter equipment by location" value={activeLocationFilter} onChange={event => setActiveLocationFilter(event.target.value)}>
                                {locations.map(location => <option key={location} value={location}>{location === 'All' ? 'All locations' : location}</option>)}
                            </select>}
                            {[...new Set(sortedAllCarts.map(([, data]) => data.type || 'Equipment'))].map(type => {
                                const carts = filteredCarts.filter(([, data]) => (data.type || 'Equipment') === type);
                                return carts.length > 0 && <section className="equipment-group" key={type}><h2>{type}</h2>
                                    {carts.map(([name]) => <button key={name} className={`nav-item ${currentView === 'schedule' && selectedCart === name ? 'active' : ''}`}
                                        aria-pressed={selectedCart === name} disabled={isSaving} onClick={() => selectEquipment(name)}>
                                        <Icon name={type === 'Chromebook' ? 'laptop' : type === 'iPad' ? 'tablet-screen-button' : 'desktop'} /><span>{name}</span>
                                    </button>)}
                                </section>;
                            })}
                            {cartsLoaded && filteredCarts.length === 0 && <p className="px-3 py-5 text-xs text-gray-500">No equipment found.</p>}
                        </div>
                        <div className="sidebar-footer">
                            {isAdmin && <button className={`nav-item ${currentView === 'admin' ? 'active' : ''}`} onClick={() => { changeView('admin'); setAdminTab('carts'); }} disabled={isSaving}><Icon name="gear" /><span>Settings</span></button>}
                            <div className="account">
                                <span className="avatar" aria-hidden="true">{currentUser?.name?.split(/\s+/).map(part => part[0]).slice(0, 2).join('').toUpperCase()}</span>
                                <span className="account-name">{currentUser?.name}</span>
                                <IconButton label="Sign out" name="right-from-bracket" className="quiet" onClick={handleLogout} disabled={isSaving} />
                            </div>
                        </div>
                    </aside>

                    <div className="workspace no-print" inert={(sidebarOpen || (bookingModal.isOpen && compactViewport)) ? '' : undefined}>
                        <header className="workspace-header">
                            <IconButton label="Open navigation" name="bars" className="quiet mobile-menu" onClick={() => setSidebarOpen(true)} />
                            <div className="workspace-title">
                                <h1>{currentView === 'schedule' ? (selectedCart || 'Schedule') : currentView === 'my-bookings' ? 'My bookings' : currentView === 'admin' ? 'Settings' : 'Print records'}</h1>

                                    </div>
                                    <div className="bg-red-50 border-2 border-red-100 rounded-xl p-3 text-xs font-bold text-duo-red">
                                        <i aria-hidden="true" className="fa-solid fa-triangle-exclamation mr-1"></i> 儲存後，該時段內現有的預約將被覆蓋移除。
                                    </div>
                                    <div className="flex gap-4 pt-4 border-t-2 border-duo-grayBorder">
                                        <button type="button" onClick={() => setLockModal({ isOpen: false, lockId: null, data: null })} className="flex-1 bg-white border-2 border-duo-grayBorder text-gray-400 font-extrabold uppercase py-3 rounded-2xl shadow-duo-gray active:shadow-none active:translate-y-[4px] transition-all">取消</button>
                                        <button type="submit" className="flex-[2] bg-duo-green text-white font-extrabold uppercase py-3 rounded-2xl shadow-duo-green active:shadow-none active:translate-y-[4px] transition-all">儲存</button>
                                    </div>
                                </form>
                            </FocusPanel>
                        </div>
                    )}

                    {alertModal.isOpen && <div className="message-backdrop no-print">
                        <FocusPanel className="message-dialog" titleId="alert-heading" onClose={() => setAlertModal({ isOpen: false, message: '' })}>
                            <h2 id="alert-heading">Notice</h2><p>{alertModal.message}</p>
                            <div className="message-actions"><button type="button" className="ui-button primary" onClick={() => setAlertModal({ isOpen: false, message: '' })}>Got it</button></div>
                        </FocusPanel>
                    </div>}

                    {confirmModal.isOpen && <div className="message-backdrop no-print">
                        <FocusPanel className="message-dialog" titleId="confirm-heading" onClose={() => setConfirmModal({ isOpen: false, message: '', onConfirm: null })}>
                            <h2 id="confirm-heading">Confirm action</h2><p>{confirmModal.message}</p>
                            <div className="message-actions">
                                <button type="button" className="ui-button" onClick={() => setConfirmModal({ isOpen: false, message: '', onConfirm: null })}>Cancel</button>
                                <button type="button" className="ui-button primary" onClick={() => { confirmModal.onConfirm(); setConfirmModal({ isOpen: false, message: '', onConfirm: null }); }}>Confirm</button>
                            </div>
                        </FocusPanel>
                    </div>}

                    {toast && <div className="toast no-print" role="status"><Icon name="circle-check" /><span>{toast}</span><IconButton label="Dismiss notification" name="xmark" className="quiet" onClick={() => setToast('')} /></div>}

                    <style>{`
                        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
                        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
                    `}</style>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
