<body class="bg-white font-sans text-duo-text selection:bg-duo-green selection:text-white">
    
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, GoogleAuthProvider, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, doc, getDoc, setDoc, deleteDoc, onSnapshot, runTransaction, query, orderBy, limit, serverTimestamp, updateDoc, deleteField, writeBatch } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        window.fbModules = {
            initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, GoogleAuthProvider, signInWithPopup, signOut,
            getFirestore, collection, doc, getDoc, setDoc, deleteDoc, onSnapshot, runTransaction, query, orderBy, limit, serverTimestamp, updateDoc, deleteField, writeBatch
        };

    <script type="text/babel">
        // 🔧 FIX [效能]: 加入 useMemo & useCallback，避免每次 render 重新計算
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        const Icon = ({ name, ...props }) => <i aria-hidden="true" className={`fa-solid fa-${name}`} {...props} />;
        const IconButton = ({ label, name, className = '', ...props }) => (
            <button type="button" className={`icon-button ${className}`} aria-label={label} title={label} {...props}><Icon name={name} /></button>
        );

        function SelectionCheckbox({ mixed = false, ...props }) {
            const inputRef = useRef(null);
            useEffect(() => { if (inputRef.current) inputRef.current.indeterminate = mixed; }, [mixed]);
            return <input ref={inputRef} type="checkbox" {...props} />;
        }

        function PaperPreview({ children, actualSize }) {
            const viewportRef = useRef(null);
            const paperRef = useRef(null);
            const [size, setSize] = useState({ scale: 1, height: 794, width: 1123 });
            useEffect(() => {
                const measure = () => {
                    const width = paperRef.current.offsetWidth;
                    const availableWidth = viewportRef.current.clientWidth;
                    if (!width || !availableWidth) return;
                    const scale = actualSize ? 1 : Math.min(1, availableWidth / width);
                    setSize({ scale, height: paperRef.current.offsetHeight * scale, width: width * scale });
                };
                const observer = new ResizeObserver(measure);
                observer.observe(viewportRef.current);
                observer.observe(paperRef.current);
                return () => observer.disconnect();
            }, [actualSize]);
            return <div className="print-preview-scroll" ref={viewportRef}>
                <div className="print-preview-frame" style={{ width: size.width, height: size.height }}>
                    <div ref={paperRef} className="print-preview-paper" style={{ transform: `scale(${size.scale})` }}>{children}</div>
                </div>
            </div>;
        }

        function ReservationSheet({ cartName, cart, week, dateRange, days, rows, options }) {
            const signatures = () => <div className="paper-signatures"><span>Out <i /></span><span>Return <i /></span></div>;
            return <article className="reservation-sheet" aria-label={`${cartName} reservation sheet`}>
                <header className="paper-header">
                    <div className="paper-identity"><div className="paper-brand"><Icon name="laptop" />IBSH</div><h2>{cartName}</h2><p>{cart.type} · {cart.capacity} devices · {cart.location}</p></div>
                    <div className="paper-week"><strong>Week {week}</strong><span>{dateRange}</span><small>Equipment reservation record</small></div>
                </header>
                {options.notes && cart.notes && <p className="paper-note"><strong>Equipment note</strong> {cart.notes}</p>}
                <table className="paper-table">
                    <colgroup><col className="paper-period-column" />{days.map(day => <col key={day.name} />)}</colgroup>
                    <thead>
                        <tr className="paper-context"><th colSpan={days.length + 1}>{cartName} · Week {week} · {dateRange}</th></tr>
                        <tr><th scope="col">Period</th>{days.map(day => <th scope="col" key={day.name}><span>{day.name}</span><small>{day.date}</small></th>)}</tr>
                    </thead>
                    <tbody>{rows.map(row => row.id === 'lunch' ? (
                        <tr key="lunch" className="paper-lunch"><td colSpan={days.length + 1}>Lunch · {row.time}</td></tr>
                    ) : (
                        <tr key={row.id}>
                            <th scope="row" className="paper-period">P{row.id}<small>{row.time}</small></th>
                            {row.slots.map((slot, dayIdx) => <td key={dayIdx} className={slot.lock ? 'paper-locked' : ''}>
                                {slot.lock ? <div className="paper-lock"><Icon name="lock" /><strong>{slot.lock.name}</strong><span>Unavailable</span></div> : slot.bookings.length ? (
                                    slot.bookings.map((booking, index) => <div className="paper-booking" key={booking.id || index}>
                                        <div className="paper-booking-heading"><strong>{booking.name}</strong><span>{booking.quantity} devices</span></div>
                                        <p>{booking.className}</p>
                                        {options.signatures && signatures()}
                                    </div>)
                                ) : <div className="paper-empty">{options.signatures && signatures()}</div>}
                            </td>)}
                        </tr>
                    ))}</tbody>
                </table>
                <footer className="paper-footer"><span>{cartName} · Week {week}</span><span>IBSH · Equipment reservations</span></footer>
            </article>;
        }

        function FocusPanel({ children, onClose, modal = true, busy = false, className = '', titleId }) {
            const panelRef = useRef(null);
            const closeRef = useRef(onClose);
            closeRef.current = onClose;
            useEffect(() => {
                const previous = document.activeElement;
                panelRef.current?.focus();
                return () => { if (previous?.isConnected) previous.focus(); };
            }, []);
            return <section ref={panelRef} tabIndex={-1} role="dialog" aria-modal={modal || undefined} aria-labelledby={titleId} className={className} onKeyDown={event => {
                if (event.key === 'Escape' && !busy) { event.stopPropagation(); closeRef.current(); }
                if (event.key !== 'Tab' || !modal) return;
                const focusable = [...panelRef.current.querySelectorAll('button, input, select, textarea, [tabindex="0"]')].filter(el => !el.disabled && el.getClientRects().length);
                const first = focusable[0], last = focusable[focusable.length - 1];
                if (!first) { event.preventDefault(); return; }
                if (event.shiftKey && (document.activeElement === first || document.activeElement === panelRef.current)) { event.preventDefault(); last.focus(); }
                else if (!event.shiftKey && (document.activeElement === last || document.activeElement === panelRef.current)) { event.preventDefault(); first.focus(); }
            }}>{children}</section>;
        }

        const isCanvasEnv = typeof __firebase_config !== 'undefined';
        const defaultFirebaseConfig = {
            apiKey: "AIzaSyC13KFTs6QifMQc0HVsUstfjAmLbpoF0t4",
            authDomain: "cartreserver.firebaseapp.com",
            projectId: "cartreserver",
            storageBucket: "cartreserver.firebasestorage.app",
            messagingSenderId: "86740355319",
            appId: "1:86740355319:web:66828caf35bbdb04f5abf2"
        };

        const firebaseConfig = isCanvasEnv ? JSON.parse(__firebase_config) : defaultFirebaseConfig;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cartreserver-app';

        const initialData = {
            "Cart 8": { type: "Chromebook", location: "Student Affairs Office", capacity: 30, schedule: {}, notes: "Elevator malfunction, please note", order: 0 },
            "Cart 4": { type: "Chromebook", location: "Student Affairs Office", capacity: 20, schedule: {}, order: 1 },
            "Cart 6": { type: "Chromebook", location: "Subject Building", capacity: 22, notes: "Under maintenance (#04, #08)", schedule: {}, order: 2 },
            "iPad Cart 1": { type: "iPad", location: "Academic Affairs Office", capacity: 21, schedule: {}, order: 3 },
        };

        const initialUsers = {
            "bianca@school.edu": { name: "Bianca", email: "bianca@school.edu", defaultClass: "11A", customClass: "" },
            "yvonne@school.edu": { name: "Yvonne", email: "yvonne@school.edu", defaultClass: "11B", customClass: "" }
        };

        const periods = [
            { id: 1, time: "8:10-9:00", name: "Period 1" }, { id: 2, time: "9:10-10:00", name: "Period 2" },
            { id: 3, time: "10:10-11:00", name: "Period 3" }, { id: 4, time: "11:10-12:00", name: "Period 4" },
            { id: "lunch", time: "12:00-13:00", name: "Lunch Break" },
            { id: 5, time: "13:10-14:00", name: "Period 5" }, { id: 6, time: "14:10-15:00", name: "Period 6" },
            { id: 7, time: "15:20-16:10", name: "Period 7" }, { id: 8, time: "16:20-17:10", name: "Period 8" }
        ];

        const baseDays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
        const classOptions = Array.from({ length: 12 }, (_, i) => [`${i + 1}A`, `${i + 1}B`]).flat();
        classOptions.push("Other (Specify)");

        const getTimestamp = () => new Date().toLocaleString('en-US', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

        function App() {
            const [firebaseReady, setFirebaseReady] = useState(false);
            const [dbRefs, setDbRefs] = useState(null);
            
            const [alertModal, setAlertModal] = useState({ isOpen: false, message: '' });
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, message: '', onConfirm: null });

            const showAlert = (message) => setAlertModal({ isOpen: true, message });
            const showConfirm = (message, onConfirm) => setConfirmModal({ isOpen: true, message, onConfirm });

            const [currentView, setCurrentView] = useState('schedule');
            const [viewHistory, setViewHistory] = useState(['schedule']);
            const [activeLocationFilter, setActiveLocationFilter] = useState('All'); 
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCart, setSelectedCart] = useState(null);
            const [adminTab, setAdminTab] = useState('carts');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [mobileDay, setMobileDay] = useState(Math.min(4, Math.max(0, new Date().getDay() - 1)));
            const [compactViewport, setCompactViewport] = useState(window.innerWidth < 1280);
            const [mobileViewport, setMobileViewport] = useState(window.innerWidth < 768);
            const sidebarRef = useRef(null);
            const [cartsLoaded, setCartsLoaded] = useState(false);
            const [dataError, setDataError] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const bookingBusy = useRef(false);
            const [toast, setToast] = useState('');
            
            const [semesterConfig, setSemesterConfig] = useState({ startDate: '2026-02-23', totalWeeks: 19, maxAdvanceWeeks: 2 });
            const [tempSemesterConfig, setTempSemesterConfig] = useState({ ...semesterConfig });
            const [semesterConfigLoaded, setSemesterConfigLoaded] = useState(false);

            const [selectedWeek, setSelectedWeek] = useState(1);
            const [currentRealWeek, setCurrentRealWeek] = useState(1);
            const [allowSaturday, setAllowSaturday] = useState(false);
            const currentDays = allowSaturday ? [...baseDays, "Saturday"] : baseDays;

            const [cartData, setCartData] = useState({});
            const [usersDB, setUsersDB] = useState({}); 
            const [activityLogs, setActivityLogs] = useState([]); 
            
            const [currentUser, setCurrentUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            
            const [authMode, setAuthMode] = useState('login');
            
            const [adminAddUserModal, setAdminAddUserModal] = useState({ isOpen: false });
            const [addUserForm, setAddUserForm] = useState({ name: '', email: '', classType: '1A', customClass: '' });

            const [bookingModal, setBookingModal] = useState({ isOpen: false, dayIdx: null, periodId: null, existingBooking: null, isEditing: false, isBatch: false, isPast: false });
            const [bookForm, setBookForm] = useState({ name: '', subject: '', quantity: 1 });
            const [editBookForm, setEditBookForm] = useState({ name: '', email: '', subject: '', quantity: 1 });
            const [editCartModal, setEditCartModal] = useState({ isOpen: false, cartName: null, data: null });
            const [printSelection, setPrintSelection] = useState([]);
            const [printPreviewCart, setPrintPreviewCart] = useState(null);
            const [printActualSize, setPrintActualSize] = useState(false);
            const [printOptions, setPrintOptions] = useState({ signatures: true, notes: true });

            const [recurringLocks, setRecurringLocks] = useState([]);
            const [lockModal, setLockModal] = useState({ isOpen: false, lockId: null, data: null });

            const [isBatchMode, setIsBatchMode] = useState(false);
            const [batchSelection, setBatchSelection] = useState([]);
            const [myBookingsView, setMyBookingsView] = useState('list');
            const [myBookingsTab, setMyBookingsTab] = useState('upcoming');

            const changeView = (newView) => {
                if (bookingBusy.current) return;
                setSidebarOpen(false);
                setBookingModal({ isOpen: false });
                setBatchSelection([]);
                setIsBatchMode(false);
                if (newView === currentView) return;
                setViewHistory(prev => [...prev, newView]);
                setCurrentView(newView);
            };

            const goBack = () => {
                if (bookingBusy.current) return;
                if (viewHistory.length > 1) {
                    const newHistory = [...viewHistory];
                    newHistory.pop();
                    setViewHistory(newHistory);
                    setCurrentView(newHistory[newHistory.length - 1]);
                } else {
                    setCurrentView('schedule');
                }
            };

            const goHome = () => {
                changeView('schedule');
                setViewHistory(['schedule']);
            };

            const closeBooking = () => { if (!bookingBusy.current) setBookingModal({ isOpen: false }); };
            const selectEquipment = name => {
                if (bookingBusy.current) return;
                setSelectedCart(name);
                changeView('schedule');
            };
            const selectWeek = week => {
                if (bookingBusy.current) return;
                setBookingModal({ isOpen: false });
                setBatchSelection([]);
                setSelectedWeek(Math.max(1, Math.min(semesterConfig.totalWeeks, week)));
            };
            const handleLogout = async () => {
                if (bookingBusy.current) return;
                try {
                    await dbRefs.fb.signOut(dbRefs.auth);
                    setCurrentUser(null); setIsAdmin(false); setCartData({}); setActivityLogs([]); setUsersDB({});
                    setSemesterConfigLoaded(false); setCartsLoaded(false); setSelectedCart(null); goHome();
                } catch (error) { showAlert('Could not sign out. Please try again.'); }
            };
            useEffect(() => {
                const media = window.matchMedia('(max-width: 1279px)');
                const mobile = window.matchMedia('(max-width: 767px)');
                const update = () => { setCompactViewport(media.matches); setMobileViewport(mobile.matches); if (!mobile.matches) setSidebarOpen(false); };
                media.addEventListener('change', update);
                mobile.addEventListener('change', update);
                return () => { media.removeEventListener('change', update); mobile.removeEventListener('change', update); };
            }, []);
            useEffect(() => {
                if (!sidebarOpen) return;
                const previous = document.activeElement;
                sidebarRef.current?.querySelector('button')?.focus();
                return () => { if (previous?.isConnected) previous.focus(); };
            }, [sidebarOpen]);
            useEffect(() => {
                if (!sidebarOpen && !(compactViewport && bookingModal.isOpen) && !alertModal.isOpen && !confirmModal.isOpen) return;
                const previous = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                return () => { document.body.style.overflow = previous; };
            }, [sidebarOpen, compactViewport, bookingModal.isOpen, alertModal.isOpen, confirmModal.isOpen]);
            useEffect(() => {
                if (!toast) return;
                const timer = setTimeout(() => setToast(''), 4500);
                return () => clearTimeout(timer);
            }, [toast]);
            useEffect(() => {
                if (!allowSaturday && mobileDay > 4) setMobileDay(4);
            }, [allowSaturday, mobileDay]);

            // 🔧 FIX [安全]: 移除 signInAnonymously，改為僅 Google 登入
        // 原本每個訪客都會建立匿名帳號，導致 Firebase Auth 充滿無用帳號，
        // 且匿名帳號也能通過 rules 的 isAuthenticated() 讀寫資料。
        // 現在改為：頁面載入 → 顯示登入畫面 → Google 登入後才能存取 Firestore。
        // onAuthStateChanged 負責在頁面重新整理時自動恢復 Google session。
        useEffect(() => {
                const initFirebase = async () => {
                    const fb = window.fbModules;
                    const app = fb.initializeApp(firebaseConfig);
                    const auth = fb.getAuth(app);
                    const db = fb.getFirestore(app);

                    const getCol = (colName) => isCanvasEnv
                        ? fb.collection(db, 'artifacts', appId, 'public', 'data', colName)
                        : fb.collection(db, colName);

                    const getDocRef = (colName, docId) => isCanvasEnv
                        ? fb.doc(db, 'artifacts', appId, 'public', 'data', colName, String(docId))
                        : fb.doc(db, colName, String(docId));

                    const refs = { getCol, getDocRef, db, auth, fb };
                    setDbRefs(refs);

                    // Canvas 環境使用 Custom Token
                    if (isCanvasEnv && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        try {
                            await fb.signInWithCustomToken(auth, __initial_auth_token);
                        } catch (e) {
                            console.error("Auth Error:", e);
                            setFirebaseReady('auth-error');
                            return;
                        }
                    }

                    // 監聽 Auth 狀態：處理頁面重整時的 session 恢復
                    const ADMIN_EMAIL = 'ptaopenhour@ibsh.tw';
                    fb.onAuthStateChanged(auth, async (user) => {
                        if (user && user.email) {
                            // 已有 Google session，自動恢復登入狀態
                            if (user.email === ADMIN_EMAIL) {
                                setIsAdmin(true);
                                setCurrentUser({ name: 'System Admin', email: ADMIN_EMAIL, defaultClass: 'Admin', customClass: '' });
                            } else {
                                try {
                                    const userDocRef = refs.getDocRef('users', user.email);
                                    const userDoc = await refs.fb.getDoc(userDocRef);
                                    if (userDoc.exists()) {
                                        setCurrentUser(userDoc.data());
                                        setIsAdmin(false);
                                    } else {
                                        // 白名單中沒有此帳號，登出
                                        await fb.signOut(auth);
                                    }
                                } catch (e) {
                                    console.error("Session restore error:", e);
                                }
                            }
                        }
                        // 不管有沒有 session，都設為 ready（讓登入畫面能顯示）
                        setFirebaseReady(true);
                    });
                };

                if (window.fbModules) initFirebase();
                else window.addEventListener('firebaseLoaded', initFirebase);
            }, []);

            // 🔧 FIX [安全]: Cart & Settings 訂閱改為「登入後才啟動」
            // 原本匿名用戶就能觸發 onSnapshot 讀取所有推車資料。
            // 現在加上 currentUser || isAdmin 條件，確保只有通過 Google 登入的用戶才會訂閱。
            useEffect(() => {
                if (!firebaseReady || firebaseReady === 'auth-error' || !dbRefs) return;
                if (!currentUser && !isAdmin) return;

                const unsubCarts = dbRefs.fb.onSnapshot(dbRefs.getCol('carts'), (snap) => {
                    const newCarts = {};
                    snap.forEach(d => { newCarts[d.id] = d.data(); });

                    if (snap.empty && !window.__seededCarts) {
                        window.__seededCarts = true;
                        Object.entries(initialData).forEach(([k, v]) => dbRefs.fb.setDoc(dbRefs.getDocRef('carts', k), v).catch(e => {}));
                    } else {
                        setCartData(newCarts);
                    }
                    setCartsLoaded(true);
                }, err => { console.error("Firestore Error:", err); setDataError('Equipment could not be loaded. Check your connection or account access.'); });

                const unsubSettings = dbRefs.fb.onSnapshot(dbRefs.getDocRef('settings', 'main'), (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        if (data.semesterConfig) {
                            setSemesterConfig({ ...data.semesterConfig, maxAdvanceWeeks: data.semesterConfig.maxAdvanceWeeks || 2 });
                            setTempSemesterConfig({ ...data.semesterConfig, maxAdvanceWeeks: data.semesterConfig.maxAdvanceWeeks || 2 });
                        }
                        if (data.allowSaturday !== undefined) setAllowSaturday(data.allowSaturday);
                        setRecurringLocks(Array.isArray(data.recurringLocks) ? data.recurringLocks : []);
                    } else {
                        dbRefs.fb.setDoc(dbRefs.getDocRef('settings', 'main'), {
                            semesterConfig: { startDate: '2026-02-23', totalWeeks: 19, maxAdvanceWeeks: 2 },
                            allowSaturday: false
                        }).catch(e => {});
                    }
                    setSemesterConfigLoaded(true);
                }, err => { console.error("Firestore Error:", err); setDataError('Semester settings could not be loaded. Please try again.'); });

                return () => { unsubCarts(); unsubSettings(); };
            }, [firebaseReady, dbRefs, currentUser, isAdmin]);

            // Admin-only 訂閱: Users（管理員登入即訂閱）
            useEffect(() => {
                if (!dbRefs || !isAdmin) return;

                const unsubUsers = dbRefs.fb.onSnapshot(dbRefs.getCol('users'), (snap) => {
                    const newUsers = {};
                    snap.forEach(d => { newUsers[d.id] = d.data(); });

                    if (snap.empty && !window.__seededUsers) {
                        window.__seededUsers = true;
                        Object.entries(initialUsers).forEach(([k, v]) => dbRefs.fb.setDoc(dbRefs.getDocRef('users', k), v).catch(e => {}));
                    } else {
                        setUsersDB(newUsers);
                    }
                });

                return () => { unsubUsers(); };
            }, [dbRefs, isAdmin]);

            // 🔧 FIX [效能]: Logs 改為「懶載入」— 只在管理員切到 logs tab 時才訂閱
            // 原本管理員一登入就 onSnapshot 訂閱 100 筆 logs（即使在看其他 tab），
            // 每次有人操作都會觸發 snapshot，導致 Firestore 讀取次數飆高。
            // 現在只在 adminTab === 'logs' 時才啟動即時訂閱，離開 tab 自動取消訂閱。
            useEffect(() => {
                if (!dbRefs || !isAdmin || currentView !== 'admin' || adminTab !== 'logs') {
                    return;
                }

                const logsQuery = dbRefs.fb.query(
                    dbRefs.getCol('logs'),
                    dbRefs.fb.orderBy('createdAt', 'desc'),
                    dbRefs.fb.limit(100)
                );
                const unsubLogs = dbRefs.fb.onSnapshot(logsQuery, (snap) => {
                    let newLogs = [];
                    snap.forEach(d => { newLogs.push({ id: d.id, ...d.data() }); });
                    setActivityLogs(newLogs);
                });

                return () => { unsubLogs(); };
            }, [dbRefs, isAdmin, currentView, adminTab]);

            const parseLocalDate = (value) => {
                if (!value) return null;
                const parts = String(value).split(/[\/-]/).map(Number);
                if (parts.length < 3 || parts.some(Number.isNaN)) return null;

                const date = new Date(parts[0], parts[1] - 1, parts[2]);
                if (isNaN(date.getTime())) return null;

                date.setHours(0, 0, 0, 0);
                return date;
            };

            const getTodayDate = () => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                return today;
            };

            const getSlotDate = (weekNum, dayIdx) => {
                const start = parseLocalDate(semesterConfig.startDate);
                if (!start) return null;

                const slotDate = new Date(start);
                slotDate.setDate(slotDate.getDate() + (Number(weekNum) - 1) * 7 + Number(dayIdx));
                return slotDate;
            };

            const isSlotBeforeToday = (weekNum, dayIdx) => {
                const slotDate = getSlotDate(weekNum, dayIdx);
                if (!slotDate) return false;
                return slotDate < getTodayDate();
            };

            useEffect(() => {
                if (!semesterConfigLoaded) return;

                const now = getTodayDate();
                const start = parseLocalDate(semesterConfig.startDate);
                if (!start) return;
                
                const diffTime = now.getTime() - start.getTime();
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                let currentWeekCalc = Math.floor(diffDays / 7) + 1;
                
                if (currentWeekCalc < 1) currentWeekCalc = 1;
                if (currentWeekCalc > semesterConfig.totalWeeks) currentWeekCalc = semesterConfig.totalWeeks;
                
                setCurrentRealWeek(currentWeekCalc);
                setSelectedWeek(currentWeekCalc);
            }, [semesterConfigLoaded, semesterConfig.startDate, semesterConfig.totalWeeks]);

            useEffect(() => {
                if (selectedWeek > semesterConfig.totalWeeks) setSelectedWeek(semesterConfig.totalWeeks);
                setBatchSelection([]);
            }, [selectedWeek, semesterConfig.totalWeeks]);

            // =================================================================
            // 🔧 FIX [效能]: 用 useMemo 快取計算結果
            // 原本每次 render（包含與預約無關的 UI 操作如開關 modal）都重新跑
            // 排序/過濾/我的預約計算。現在只在依賴資料真正變更時才重算。
            // =================================================================
            const sortedAllCarts = useMemo(() =>
                Object.entries(cartData).sort((a, b) => (a[1].order || 0) - (b[1].order || 0)),
                [cartData]
            );

            const filteredCarts = useMemo(() =>
                sortedAllCarts
                    .filter(([name, data]) => activeLocationFilter === 'All' || data.location === activeLocationFilter)
                    .filter(([name, data]) => name.toLowerCase().includes(searchQuery.toLowerCase()) || (data.notes && data.notes.toLowerCase().includes(searchQuery.toLowerCase()))),
                [sortedAllCarts, activeLocationFilter, searchQuery]
            );

            useEffect(() => {
                if (!cartsLoaded) return;
                if (!selectedCart || !cartData[selectedCart]) {
                    setSelectedCart(sortedAllCarts[0]?.[0] || null);
                    setBookingModal({ isOpen: false });
                    setBatchSelection([]);
                    setIsBatchMode(false);
                }
            }, [cartData, cartsLoaded, selectedCart, sortedAllCarts]);

            const locations = useMemo(() =>
                ['All', ...Array.from(new Set(Object.values(cartData).map(c => c.location).filter(Boolean)))],
                [cartData]
            );

            const weeksArray = useMemo(() =>
                Array.from({ length: semesterConfig.totalWeeks }, (_, i) => i + 1),
                [semesterConfig.totalWeeks]
            );
            
            const moveCart = async (cartName, direction) => {
                const sortedNames = sortedAllCarts.map(arr => arr[0]);
                const idx = sortedNames.indexOf(cartName);
                if (direction === 'up' && idx > 0) [sortedNames[idx - 1], sortedNames[idx]] = [sortedNames[idx], sortedNames[idx - 1]];
                else if (direction === 'down' && idx < sortedNames.length - 1) [sortedNames[idx + 1], sortedNames[idx]] = [sortedNames[idx], sortedNames[idx + 1]];
                else return;
                
                try {
                    const batch = dbRefs.fb.writeBatch(dbRefs.db);
                    let hasChanges = false;
                    for (let i = 0; i < sortedNames.length; i++) {
                        const cName = sortedNames[i];
                        if ((cartData[cName].order || 0) !== i) {
                            batch.update(dbRefs.getDocRef('carts', cName), { order: i });
                            hasChanges = true;
                        }
                    }
                    if (hasChanges) await batch.commit();
                } catch (e) {
                    console.error("Move error:", e);
                    showAlert("Failed to reorder carts.");
                }
            };

            const getIcon = (type) => {
                if (type === 'Chromebook') return <div className="w-12 h-12 bg-duo-blue/10 rounded-2xl flex items-center justify-center shrink-0"><i aria-hidden="true" className="fa-solid fa-laptop text-duo-blue text-2xl"></i></div>;
                if (type === 'iPad') return <div className="w-12 h-12 bg-duo-green/10 rounded-2xl flex items-center justify-center shrink-0"><i aria-hidden="true" className="fa-solid fa-tablet-screen-button text-duo-green text-2xl"></i></div>;
                return <div className="w-12 h-12 bg-duo-yellow/10 rounded-2xl flex items-center justify-center shrink-0"><i aria-hidden="true" className="fa-solid fa-desktop text-duo-yellow text-2xl"></i></div>;
            };

            const addLog = async (action, cart, details, specificUser = null) => {
                const operator = isAdmin ? 'Admin' : (currentUser ? currentUser.name : 'Unknown');
                const id = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
                const newLog = { 
                    time: getTimestamp(), 
                    operator: specificUser || operator, 
                    action, 
                    cart, 
                    details,
                    createdAt: dbRefs.fb.serverTimestamp() 
                };
                if (dbRefs) {
                    try { await dbRefs.fb.setDoc(dbRefs.getDocRef('logs', id), newLog); }
                    catch (error) { console.warn('Activity log could not be saved:', error); }
                }
            };

            const getWeekDateRange = (weekNum, includeSat) => {
                const start = parseLocalDate(semesterConfig.startDate);
                if (!start) return "Invalid Date";
                start.setDate(start.getDate() + (weekNum - 1) * 7);
                const end = new Date(start);
                end.setDate(end.getDate() + (includeSat ? 5 : 4)); 
                return `${start.getMonth() + 1}/${start.getDate()} - ${end.getMonth() + 1}/${end.getDate()}`;
            };

            const getDateForDayIdx = (weekNum, dayIdx) => {
                const date = getSlotDate(weekNum, dayIdx);
                if (!date) return "";
                return `${date.getMonth() + 1}/${date.getDate()}`;
            };

            const getWeekHeading = () => {
                const start = getSlotDate(selectedWeek, 0), end = getSlotDate(selectedWeek, allowSaturday ? 5 : 4);
                if (!start || !end) return '';
                const first = start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const last = start.getMonth() === end.getMonth() ? end.getDate() : end.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                return `${first} - ${last}, ${end.getFullYear()}`;
            };

            const getSafeQuantity = (value, fallback = 1) => {
                const parsed = Number(value);
                if (!Number.isFinite(parsed)) return fallback;
                return Math.max(1, Math.floor(parsed));
            };

            const getBookingQuantity = (booking) => getSafeQuantity(booking?.quantity, 1);

            const getCartCapacity = (cartOrData) => {
                const data = typeof cartOrData === 'string' ? cartData[cartOrData] : cartOrData;
                return getSafeQuantity(data?.capacity, 1);
            };

            const normalizeSlotBookings = (slotValue) => {
                if (!slotValue) return [];

                if (Array.isArray(slotValue.bookings)) {
                    return slotValue.bookings
                        .filter(Boolean)
                        .map((booking, index) => ({
                            ...booking,
                            id: booking.id || `legacy_${index}`,
                            quantity: getBookingQuantity(booking)
                        }));
                }

                return [{
                    ...slotValue,
                    id: slotValue.id || 'legacy',
                    quantity: getBookingQuantity(slotValue)
                }];
            };

            const getSlotUsedQuantity = (slotValue) =>
                normalizeSlotBookings(slotValue).reduce((total, booking) => total + getBookingQuantity(booking), 0);

            const getSlotRemainingQuantity = (cartName, slotId, scheduleOverride = null) => {
                const cart = cartData[cartName] || {};
                const schedule = scheduleOverride || cart.schedule || {};
                return Math.max(0, getCartCapacity(cart) - getSlotUsedQuantity(schedule[slotId]));
            };

            const makeBookingId = () => `booking_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;

            const setSlotBookings = (schedule, slotId, bookings) => {
                const cleanedBookings = bookings
                    .filter(Boolean)
                    .map((booking) => ({
                        id: booking.id || makeBookingId(),
                        name: booking.name || '',
                        email: booking.email || booking.ownerEmail || '',
                        className: booking.className || '',
                        ownerEmail: booking.ownerEmail || booking.email || '',
                        quantity: getBookingQuantity(booking),
                        createdAt: booking.createdAt || getTimestamp()
                    }));

                if (cleanedBookings.length === 0) {
                    delete schedule[slotId];
                } else {
                    schedule[slotId] = { bookings: cleanedBookings };
                }
            };

            const findBookingIndex = (bookings, bookingId) => {
                const targetId = String(bookingId || 'legacy');
                return bookings.findIndex((booking, index) => {
                    const currentId = String(booking.id || (index === 0 ? 'legacy' : `legacy_${index}`));
                    return currentId === targetId;
                });
            };

            const getDefaultSubject = (user) => {
                if (!user) return '';
                return user.defaultClass === 'Other (Specify)' ? (user.customClass || '') : (user.defaultClass || '');
            };

            const createDefaultBookForm = (quantity) => ({
                name: currentUser?.name || '',
                subject: getDefaultSubject(currentUser),
                quantity: Math.max(1, getSafeQuantity(quantity, 1))
            });

            const handleSaturdayToggle = async (e) => {
                const newVal = e.target.checked;
                setAllowSaturday(newVal); 
                if (dbRefs) {
                    await dbRefs.fb.setDoc(dbRefs.getDocRef('settings', 'main'), { allowSaturday: newVal }, { merge: true });
                    addLog(newVal ? "Enable Saturday" : "Disable Saturday", "System", "Admin toggled Saturday booking setting");
                }
            };

            // 🔧 FIX [安全]: Google 登入流程
            // signInWithPopup 成功後，onAuthStateChanged 會自動觸發 session 恢復。
            // 這裡只需要處理 Canvas 環境模擬登入和登入失敗的情況。
            const handleGoogleLogin = async () => {
                const ADMIN_EMAIL = 'ptaopenhour@ibsh.tw';

                if (isCanvasEnv) {
                    const testEmail = prompt(`【預覽環境模擬登入】\n\n請輸入你想模擬驗證的信箱:\n(最高權限管理員請輸入 ${ADMIN_EMAIL})`, ADMIN_EMAIL);
                    if (!testEmail) return;

                    if (testEmail.trim() === ADMIN_EMAIL) {
                        setIsAdmin(true);
                        setCurrentUser({ name: 'System Admin', email: ADMIN_EMAIL, defaultClass: 'Admin', customClass: '' });
                        goHome();
                        return;
                    }

                    const userDocRef = dbRefs.getDocRef('users', testEmail.trim());
                    const userDoc = await dbRefs.fb.getDoc(userDocRef);
                    if (userDoc.exists()) {
                        setCurrentUser(userDoc.data());
                        setIsAdmin(false);
                        goHome();
                    } else {
                        showAlert(`Access Denied.\nYour account (${testEmail}) is not in the allowed whitelist.`);
                    }
                    return;
                }

                try {
                    const provider = new dbRefs.fb.GoogleAuthProvider();
                    const result = await dbRefs.fb.signInWithPopup(dbRefs.auth, provider);
                    const userEmail = result.user.email;

                    // onAuthStateChanged 會自動處理 session 恢復，
                    // 但如果白名單中沒有此帳號，需要立即登出並顯示錯誤。
                    if (userEmail !== ADMIN_EMAIL) {
                        const userDocRef = dbRefs.getDocRef('users', userEmail);
                        const userDoc = await dbRefs.fb.getDoc(userDocRef);
                        if (!userDoc.exists()) {
                            await dbRefs.fb.signOut(dbRefs.auth);
                            setCurrentUser(null);
                            setIsAdmin(false);
                            showAlert(`Access Denied.\nYour email (${userEmail}) is not registered in the whitelist.\nPlease contact the administrator.`);
                        }
                    }
                    // 如果驗證通過，onAuthStateChanged 已經設好 currentUser & isAdmin
                } catch (error) {
                    console.error(error);
                    if (error.code !== 'auth/popup-closed-by-user') {
                        showAlert(`Google Login Failed: ${error.message}`);
                    }
                }
            };

            const handleAdminAddUser = async (e) => {
                e.preventDefault();
                const email = addUserForm.email.trim();
                try {
                    const existingDoc = await dbRefs.fb.getDoc(dbRefs.getDocRef('users', email));
                    if (existingDoc.exists()) {
                        return showAlert("This email is already registered in the whitelist!");
                    }
                    const newUser = {
                        name: addUserForm.name.trim(), 
                        email: email, 
                        defaultClass: addUserForm.classType, 
                        customClass: addUserForm.customClass
                    };
                    await dbRefs.fb.setDoc(dbRefs.getDocRef('users', email), newUser);
                    addLog("Add User", "System", `Admin added user to whitelist: ${email}`);
                    showAlert("Teacher added to the whitelist successfully!");
                    setAddUserForm({ name: '', email: '', classType: '1A', customClass: '' });
                    setAdminAddUserModal({ isOpen: false });
                } catch(err) {
                    console.error(err);
                    showAlert("Failed to add user.");
                }
            };

            const handleSemesterConfigSave = async (e) => {
                e.preventDefault();
                await dbRefs.fb.setDoc(dbRefs.getDocRef('settings', 'main'), { semesterConfig: tempSemesterConfig }, { merge: true });
                addLog("Update Config", "System", `Start Date: ${tempSemesterConfig.startDate}, Total Weeks: ${tempSemesterConfig.totalWeeks}, Advance: ${tempSemesterConfig.maxAdvanceWeeks}W`);
                showAlert("Semester configuration updated successfully!");
            };

            const handleClearSemesterData = () => {
                showConfirm("⚠️ WARNING: Are you sure you want to clear ALL booking records?\n\nThis action cannot be undone!", async () => {
                    try {
                        const batch = dbRefs.fb.writeBatch(dbRefs.db);
                        for (const cartName of Object.keys(cartData)) {
                            batch.update(dbRefs.getDocRef('carts', cartName), { schedule: {} });
                        }
                        await batch.commit();
                        
                        setSelectedWeek(1);
                        addLog("Clear Data", "System", "Admin cleared all booking records (New Semester)");
                        showAlert("All booking data has been cleared!");
                    } catch (error) {
                        console.error("Batch clear error:", error);
                        showAlert("Failed to clear all data due to a network error. Please try again.");
                    }
                });
            };

            const getLockForSlot = (cartName, week, dayIdx, periodId) => {
                if (periodId === 'lunch') return null;
                return recurringLocks.find(lock =>
                    lock.cartName === cartName &&
                    Number(lock.dayIdx) === Number(dayIdx) &&
                    String(lock.periodId) === String(periodId) &&
                    week >= Number(lock.startWeek) &&
                    week < Number(lock.startWeek) + Number(lock.weeks)
                ) || null;
            };

            const saveLock = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const lockData = {
                    id: lockModal.lockId || `lock_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`,
                    name: formData.get('name').trim() || 'Locked',
                    cartName: formData.get('cartName'),
                    dayIdx: Number(formData.get('dayIdx')),
                    periodId: formData.get('periodId'),
                    startWeek: Number(formData.get('startWeek')),
                    weeks: Number(formData.get('weeks'))
                };

                if (!lockData.cartName) { showAlert("請選擇一個 Cart。"); return; }
                if (lockData.weeks < 1) { showAlert("持續週數必須至少 1 週。"); return; }

                try {
                    const newLocks = lockModal.lockId
                        ? recurringLocks.map(l => l.id === lockModal.lockId ? lockData : l)
                        : [...recurringLocks, lockData];

                    await dbRefs.fb.setDoc(dbRefs.getDocRef('settings', 'main'), { recurringLocks: newLocks }, { merge: true });

                    const cartRef = dbRefs.getDocRef('carts', lockData.cartName);
                    await dbRefs.fb.runTransaction(dbRefs.db, async (transaction) => {
                        const cartDoc = await transaction.get(cartRef);
                        if (!cartDoc.exists()) return;
                        const schedule = cartDoc.data().schedule || {};
                        let changed = false;
                        for (let w = lockData.startWeek; w < lockData.startWeek + lockData.weeks; w++) {
                            const slotId = `w${w}_d${lockData.dayIdx}_p${lockData.periodId}`;
                            if (schedule[slotId]) { delete schedule[slotId]; changed = true; }
                        }
                        if (changed) transaction.update(cartRef, { schedule });
                    });

                    addLog(lockModal.lockId ? "Edit Lock" : "Add Lock", lockData.cartName, `${lockData.name} · Wk${lockData.startWeek}-${lockData.startWeek + lockData.weeks - 1} · ${currentDays[lockData.dayIdx] || `Day${lockData.dayIdx}`} P${lockData.periodId}`);
                    setLockModal({ isOpen: false, lockId: null, data: null });
                } catch (err) {
                    console.error("Save lock error:", err);
                    showAlert("儲存鎖定失敗，請稍後再試。");
                }
            };

            const deleteLock = (lockId) => {
                const lock = recurringLocks.find(l => l.id === lockId);
                if (!lock) return;
                showConfirm(`確定要刪除鎖定「${lock.name}」嗎？`, async () => {
                    try {
                        const newLocks = recurringLocks.filter(l => l.id !== lockId);
                        await dbRefs.fb.setDoc(dbRefs.getDocRef('settings', 'main'), { recurringLocks: newLocks }, { merge: true });
                        addLog("Delete Lock", lock.cartName, `${lock.name} · Wk${lock.startWeek}-${lock.startWeek + lock.weeks - 1}`);
                    } catch (err) {
                        console.error("Delete lock error:", err);
                        showAlert("刪除鎖定失敗，請稍後再試。");
                    }
                });
            };

            const deleteUser = (email) => {
                showConfirm(`Delete user ${usersDB[email].name} from whitelist?\nThey will no longer be able to log in.`, async () => {
                    await dbRefs.fb.deleteDoc(dbRefs.getDocRef('users', email));
                    addLog("Delete User", "System", `Admin removed account from whitelist: ${email}`);
                });
            };

            const handleSlotClick = (dayIdx, periodId, existingBooking) => {
                if (bookingBusy.current || !semesterConfigLoaded || !cartsLoaded || dataError) return;
                if (periodId === 'lunch') return;
                const slotId = `w${selectedWeek}_d${dayIdx}_p${periodId}`;

                const lock = getLockForSlot(selectedCart, selectedWeek, dayIdx, periodId);
                if (lock) {
                    showAlert(`🔒 此時段已被鎖定\n\n名稱：${lock.name}\n期間：第 ${lock.startWeek} - ${lock.startWeek + lock.weeks - 1} 週`);
                    return;
                }

                const isPastSlot = isSlotBeforeToday(selectedWeek, dayIdx);

                const isPastLimit = !isAdmin && (selectedWeek > currentRealWeek + (semesterConfig.maxAdvanceWeeks || 2));
                if (isPastLimit) {
                    showAlert(`⚠️ Booking Limit Exceeded\n\nTo ensure fairness, the system only allows bookings up to ${semesterConfig.maxAdvanceWeeks || 2} week(s) in advance.\nPlease try again closer to your desired date!`);
                    return;
                }

                if (existingBooking) {
                    setBookingModal({ isOpen: true, dayIdx, periodId, existingBooking, isEditing: false, isBatch: false, isPast: isPastSlot });
                } else {
                    if (isPastSlot && !isAdmin) {
                        showAlert("⚠️ Cannot book slots in the past!");
                        return;
                    }

                    const remainingQuantity = getSlotRemainingQuantity(selectedCart, slotId);
                    if (remainingQuantity <= 0) {
                        showAlert("這個時段的設備數量已經被借滿了。");
                        return;
                    }

                    if (isBatchMode) {
                        setBatchSelection(prev => 
                            prev.some(s => s.slotId === slotId) 
                                ? prev.filter(s => s.slotId !== slotId) 
                                : [...prev, { dayIdx, periodId, slotId }]
                        );
                    } else {
                        setBookForm(createDefaultBookForm(remainingQuantity));
                        setBookingModal({ isOpen: true, dayIdx, periodId, existingBooking: null, isEditing: false, isBatch: false, isPast: false });
                    }
                }
            };

            const renderScheduleSlot = (dayIdx, period) => {
                const slotId = `w${selectedWeek}_d${dayIdx}_p${period.id}`;
                const lock = getLockForSlot(selectedCart, selectedWeek, dayIdx, period.id);
                const bookings = normalizeSlotBookings(cartData[selectedCart]?.schedule?.[slotId]);
                const remaining = getSlotRemainingQuantity(selectedCart, slotId);
                const isPast = isSlotBeforeToday(selectedWeek, dayIdx);
                const beyondLimit = !isAdmin && selectedWeek > currentRealWeek + (semesterConfig.maxAdvanceWeeks || 2);
                const canBook = remaining > 0 && (!isPast || isAdmin) && !beyondLimit && !isSaving;
                const selected = batchSelection.some(slot => slot.slotId === slotId) ||
                    (bookingModal.isOpen && !bookingModal.isBatch && bookingModal.dayIdx === dayIdx && bookingModal.periodId === period.id);
                const label = `${selectedCart}, ${currentDays[dayIdx]} ${getDateForDayIdx(selectedWeek, dayIdx)}, Period ${period.id}`;

                if (lock) return (
                    <button type="button" className="slot-locked" aria-label={`${label}, locked: ${lock.name}`} onClick={() => handleSlotClick(dayIdx, period.id, null)}>
                        <Icon name="lock" /><span>{lock.name}</span><small>Unavailable</small>
                    </button>
                );

                return (
                    <div className={`slot ${isPast ? 'past' : ''} ${selected ? 'selected' : ''}`} data-slot={slotId}>
                        {bookings.length > 0 && <div className="slot-events">
                            {bookings.map((booking, index) => {
                                const mine = booking.ownerEmail === currentUser?.email;
                                return <button type="button" key={booking.id || index}
                                    disabled={isSaving || isBatchMode}
                                    className={`booking-strip ${mine ? 'mine' : ''}`}
                                    title={`${booking.name} · ${booking.className} · ${getBookingQuantity(booking)} devices`}
                                    aria-label={`View booking: ${booking.name}, ${booking.className}, ${getBookingQuantity(booking)} devices, ${label}`}
                                    onClick={() => handleSlotClick(dayIdx, period.id, booking)}>
                                    <strong>{booking.name} · {booking.className}</strong>
                                    <small>{getBookingQuantity(booking)} devices</small>
                                </button>;
                            })}
                        </div>}
                        <button type="button" className={`slot-availability ${bookings.length ? 'with-events' : ''}`}
                            disabled={!canBook}
                            aria-label={`${isBatchMode ? 'Select' : 'Book'} ${label}, ${remaining} available`}
                            aria-pressed={isBatchMode ? selected : undefined}
                            onClick={() => handleSlotClick(dayIdx, period.id, null)}>
                            {selected && <Icon name={isBatchMode ? 'check' : 'plus'} />}
                            {isPast && !isAdmin ? 'Past' : beyondLimit ? 'Not yet open' : remaining === 0 ? 'Fully booked' : isBatchMode && selected ? `Selected · ${remaining} available` : `${remaining} available`}
                        </button>
                    </div>
                );
            };

            const executeBookingTransaction = async (slotsToBook, bookingName, finalSubject, requestedQuantity) => {
                if (bookingBusy.current || slotsToBook.length === 0) return;
                bookingBusy.current = true;
                setIsSaving(true);
                const cartRef = dbRefs.getDocRef('carts', selectedCart);
                const quantity = getSafeQuantity(requestedQuantity, 1);

                try {
                    await dbRefs.fb.runTransaction(dbRefs.db, async (transaction) => {
                        const cartDoc = await transaction.get(cartRef);
                        if (!cartDoc.exists()) throw "CART_NOT_FOUND";

                        const currentData = cartDoc.data();
                        const currentSchedule = currentData.schedule || {};
                        const capacity = getSafeQuantity(currentData.capacity, 1);

                        for (const slot of slotsToBook) {
                            if (getLockForSlot(selectedCart, selectedWeek, slot.dayIdx, slot.periodId)) {
                                throw "SLOT_LOCKED";
                            }
                            const slotBookings = normalizeSlotBookings(currentSchedule[slot.slotId]);
                            const usedQuantity = slotBookings.reduce((total, booking) => total + getBookingQuantity(booking), 0);
                            if (usedQuantity + quantity > capacity) {
                                throw "INSUFFICIENT_QUANTITY";
                            }
                            slotBookings.push({
                                id: makeBookingId(),
                                name: bookingName, email: currentUser.email, 
                                className: finalSubject, ownerEmail: currentUser.email,
                                quantity,
                                createdAt: getTimestamp()
                            });
                            setSlotBookings(currentSchedule, slot.slotId, slotBookings);
                        }
                        transaction.update(cartRef, { schedule: currentSchedule });
                    });

                    const details = slotsToBook.length === 1 
                        ? `Week ${selectedWeek} ${currentDays[slotsToBook[0].dayIdx]} P${slotsToBook[0].periodId} (${finalSubject}, ${quantity} devices)`
                        : `Batch booked ${slotsToBook.length} slots for Week ${selectedWeek} (${finalSubject}, ${quantity} devices each)`;
                    
                    addLog("Add Booking", selectedCart, details);
                    setBookingModal({ isOpen: false, dayIdx: null, periodId: null, existingBooking: null, isEditing: false, isBatch: false });
                    setBatchSelection([]);
                    setIsBatchMode(false);
                    setToast(slotsToBook.length > 1 ? `${slotsToBook.length} reservations confirmed.` : 'Reservation confirmed.');
                    
                } catch (error) {
                    if (error === "INSUFFICIENT_QUANTITY") showAlert("可借數量不足！你選的數量超過其中一個時段的剩餘台數，請調整數量後再試。");
                    else if (error === "SLOT_LOCKED") showAlert("🔒 你選的時段中包含已被鎖定的格子，無法預約。");
                    else if (error === "CART_NOT_FOUND") showAlert("找不到該設備，可能已被管理員刪除。");
                    else showAlert("預約發生錯誤，請稍後檢查網路連線再試。");
                } finally {
                    bookingBusy.current = false;
                    setIsSaving(false);
                }
            };

            const checkConflictsAndSubmit = async () => {
                if (bookingBusy.current) return;
                const bookingName = bookForm.name.trim();
                const finalSubject = bookForm.subject.trim();
                const requestedQuantity = getSafeQuantity(bookForm.quantity, 1);
                const slotsToBook = bookingModal.isBatch ? batchSelection : [{ dayIdx: bookingModal.dayIdx, periodId: bookingModal.periodId, slotId: `w${selectedWeek}_d${bookingModal.dayIdx}_p${bookingModal.periodId}` }];

                if (!bookingName) {
                    showAlert("Please enter a name.");
                    return;
                }

                if (!finalSubject) {
                    showAlert("Please enter a subject.");
                    return;
                }

                const insufficientSlot = slotsToBook.find(slot => getSlotRemainingQuantity(selectedCart, slot.slotId) < requestedQuantity);
                if (insufficientSlot) {
                    const remaining = getSlotRemainingQuantity(selectedCart, insufficientSlot.slotId);
                    showAlert(`這個時段只剩 ${remaining} 台可借，請調整借用數量。`);
                    return;
                }
                
                const conflictingSlots = slotsToBook.filter(slot => {
                    return Object.entries(cartData).some(([cName, cData]) => {
                        return cName !== selectedCart && normalizeSlotBookings(cData.schedule?.[slot.slotId]).some(booking => booking.className === finalSubject);
                    });
                });

                if (conflictingSlots.length > 0) {
                    showConfirm(`[Duplicate Booking Warning]\nSubject "${finalSubject}" has already reserved other equipment during this time slot.\nAre you sure you want to proceed with this additional booking?`, () => {
                        executeBookingTransaction(slotsToBook, bookingName, finalSubject, requestedQuantity);
                    });
                } else {
                    executeBookingTransaction(slotsToBook, bookingName, finalSubject, requestedQuantity);
                }
            };

            // =================================================================
            // 🔧 FIX [衝突]: cancelBooking 改用 runTransaction
            // 原本用 updateDoc + deleteField，如果 Admin 同時在編輯同一筆預約，
            // 可能產生 Race Condition。改用 Transaction 確保讀寫原子性，並在預約
            // 已被取消時給予明確的錯誤訊息而不是靜默失敗。
            // =================================================================
            const cancelBooking = async () => {
                if (bookingBusy.current) return;
                bookingBusy.current = true;
                setIsSaving(true);
                const slotId = `w${selectedWeek}_d${bookingModal.dayIdx}_p${bookingModal.periodId}`;
                const cartRef = dbRefs.getDocRef('carts', selectedCart);
                
                try {
                    let cancelledName = '';
                    await dbRefs.fb.runTransaction(dbRefs.db, async (transaction) => {
                        const cartDoc = await transaction.get(cartRef);
                        if (!cartDoc.exists()) throw "CART_NOT_FOUND";
                        
                        const currentSchedule = cartDoc.data().schedule || {};
                        if (!currentSchedule[slotId]) throw "ALREADY_CANCELLED";
                        const slotBookings = normalizeSlotBookings(currentSchedule[slotId]);
                        const bookingIndex = findBookingIndex(slotBookings, bookingModal.existingBooking?.id);
                        if (bookingIndex === -1) throw "ALREADY_CANCELLED";
                        const targetBooking = slotBookings[bookingIndex];
                        
                        // 非管理員只能取消自己的預約
                        if (!isAdmin && targetBooking.ownerEmail !== currentUser.email) {
                            throw "NOT_OWNER";
                        }
                        
                        cancelledName = `${targetBooking.name} (${getBookingQuantity(targetBooking)} devices)`;
                        slotBookings.splice(bookingIndex, 1);
                        setSlotBookings(currentSchedule, slotId, slotBookings);
                        transaction.update(cartRef, { schedule: currentSchedule });
                    });

                    const actionName = isAdmin ? "Force Cancel" : "Cancel Booking";
                    addLog(actionName, selectedCart, `Week ${selectedWeek} ${currentDays[bookingModal.dayIdx]} P${bookingModal.periodId} (${cancelledName})`);
                    setBookingModal({ isOpen: false });
                    setToast('Reservation cancelled.');
                } catch (error) {
                    if (error === "ALREADY_CANCELLED") showAlert("這筆預約已經被取消了。");
                    else if (error === "NOT_OWNER") showAlert("你只能取消自己的預約。");
                    else if (error === "CART_NOT_FOUND") showAlert("找不到該設備。");
                    else showAlert("取消失敗，請稍後再試。");
                } finally {
                    bookingBusy.current = false;
                    setIsSaving(false);
                }
            };

            const handleEditClick = () => {
                const existing = bookingModal.existingBooking;
                setEditBookForm({
                    name: existing.name, email: existing.email,
                    subject: existing.className,
                    quantity: getBookingQuantity(existing)
                });
                setBookingModal(prev => ({ ...prev, isEditing: true }));
            };

            const updateBooking = async () => {
                if (bookingBusy.current) return;
                const slotId = `w${selectedWeek}_d${bookingModal.dayIdx}_p${bookingModal.periodId}`;
                const finalSubject = editBookForm.subject.trim();
                const updatedName = editBookForm.name.trim();
                const requestedQuantity = getSafeQuantity(editBookForm.quantity, 1);
                const cartRef = dbRefs.getDocRef('carts', selectedCart);

                if (!updatedName) {
                    showAlert("Please enter a name.");
                    return;
                }

                if (!finalSubject) {
                    showAlert("Please enter a subject.");
                    return;
                }

                bookingBusy.current = true;
                setIsSaving(true);
                try {
                    await dbRefs.fb.runTransaction(dbRefs.db, async (transaction) => {
                        const cartDoc = await transaction.get(cartRef);
                        if (!cartDoc.exists()) throw "CART_NOT_FOUND";

                        const currentData = cartDoc.data();
                        const currentSchedule = currentData.schedule || {};
                        const capacity = getSafeQuantity(currentData.capacity, 1);

                        if (!currentSchedule[slotId]) {
                            throw "SLOT_NOT_FOUND"; 
                        }
                        const slotBookings = normalizeSlotBookings(currentSchedule[slotId]);
                        const bookingIndex = findBookingIndex(slotBookings, bookingModal.existingBooking?.id);
                        if (bookingIndex === -1) throw "SLOT_NOT_FOUND";
                        if (!isAdmin && slotBookings[bookingIndex].ownerEmail !== currentUser.email) {
                            throw "NOT_OWNER";
                        }

                        const originalQuantity = getBookingQuantity(slotBookings[bookingIndex]);
                        const usedWithoutThisBooking = slotBookings.reduce((total, booking) => total + getBookingQuantity(booking), 0) - originalQuantity;
                        if (usedWithoutThisBooking + requestedQuantity > capacity) {
                            throw "INSUFFICIENT_QUANTITY";
                        }

                        slotBookings[bookingIndex] = { 
                            ...slotBookings[bookingIndex],
                            name: updatedName, 
                            email: isAdmin ? editBookForm.email : slotBookings[bookingIndex].email, 
                            className: finalSubject, 
                            ownerEmail: isAdmin ? editBookForm.email : slotBookings[bookingIndex].ownerEmail,
                            quantity: requestedQuantity
                        };
                        setSlotBookings(currentSchedule, slotId, slotBookings);
                        
                        transaction.update(cartRef, { schedule: currentSchedule });
                    });

                    addLog(isAdmin ? "Admin Edit" : "Edit Booking", selectedCart, `Week ${selectedWeek} ${currentDays[bookingModal.dayIdx]} P${bookingModal.periodId} (Updated: ${updatedName}, ${requestedQuantity} devices)`);
                    setBookingModal({ isOpen: false, dayIdx: null, periodId: null, existingBooking: null, isEditing: false, isBatch: false });
                    setToast('Reservation updated.');
                } catch (error) {
                    if (error === "SLOT_NOT_FOUND") showAlert("這筆預約似乎已經被使用者手動取消了！請重新確認設備狀態。");
                    else if (error === "INSUFFICIENT_QUANTITY") showAlert("更新後的數量超過此時段可用台數。");
                    else if (error === "NOT_OWNER") showAlert("你只能修改自己的預約。");
                    else if (error === "CART_NOT_FOUND") showAlert("找不到該設備。");
                    else showAlert("更新失敗，請稍後再試。");
                } finally {
                    bookingBusy.current = false;
                    setIsSaving(false);
                }
            };

            const saveCartEdit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const oldName = editCartModal.cartName;
                const newName = formData.get('name').trim();

                try {
                    if (oldName && oldName === newName) {
                        await dbRefs.fb.updateDoc(dbRefs.getDocRef('carts', newName), {
                            type: formData.get('type'), 
                            location: formData.get('location'), 
                            capacity: parseInt(formData.get('capacity')), 
                            notes: formData.get('notes')
                        });
                    } else if (oldName && oldName !== newName) {
                        await dbRefs.fb.runTransaction(dbRefs.db, async (transaction) => {
                            const oldDocRef = dbRefs.getDocRef('carts', oldName);
                            const newDocRef = dbRefs.getDocRef('carts', newName);
                            const oldDoc = await transaction.get(oldDocRef);
                            
                            if (!oldDoc.exists()) throw "CART_NOT_FOUND";
                            
                            const latestData = oldDoc.data();
                            const newData = {
                                ...latestData,
                                type: formData.get('type'), 
                                location: formData.get('location'), 
                                capacity: parseInt(formData.get('capacity')), 
                                notes: formData.get('notes')
                            };
                            
                            transaction.set(newDocRef, newData);
                            transaction.delete(oldDocRef);
                        });
                    } else {
                        const newData = {
                            type: formData.get('type'), location: formData.get('location'), capacity: parseInt(formData.get('capacity')), notes: formData.get('notes'),
                            schedule: {},
                            order: Object.keys(cartData).length
                        };
                        await dbRefs.fb.setDoc(dbRefs.getDocRef('carts', newName), newData);
                    }
                    
                    addLog(oldName ? "Edit Equipment" : "Add Equipment", "System", `Equipment: ${newName}`);
                    setEditCartModal({ isOpen: false, cartName: null, data: null });
                } catch (err) {
                    console.error("Save cart error:", err);
                    if (err === "CART_NOT_FOUND") showAlert("The cart you are trying to edit was not found or was deleted.");
                    else showAlert("Failed to save equipment. Please try again.");
                }
            };

            const deleteCart = (name) => {
                showConfirm(`Delete "${name}"?\nThis clears all its bookings.`, async () => {
                    await dbRefs.fb.deleteDoc(dbRefs.getDocRef('carts', name));
                    addLog("Delete Equipment", "System", `Equipment: ${name}`);
                    if (selectedCart === name) setSelectedCart(null);
                });
            };

            // =================================================================
            // 🔧 FIX [效能]: getMyBookings 改用 useMemo 快取
            // 原本每次 render 都重新遍歷所有 cart 的所有 schedule entries。
            // 現在只在 cartData 或 currentUser 變更時才重算。
            // =================================================================
            const allMyBookings = useMemo(() => {
                const myBookings = [];
                if (!currentUser) return myBookings;
                
                Object.entries(cartData).forEach(([cartName, data]) => {
                    if (data.schedule) {
                        Object.entries(data.schedule).forEach(([slotId, slotValue]) => {
                            normalizeSlotBookings(slotValue).forEach((bookingInfo) => {
                                if (bookingInfo.ownerEmail !== currentUser.email) return;
                                const match = slotId.match(/w(\d+)_d(\d+)_p(\w+)/);
                                if (match) {
                                    myBookings.push({
                                        cartName,
                                        week: parseInt(match[1]),
                                        dayIdx: parseInt(match[2]),
                                        periodId: match[3],
                                        slotId,
                                        bookingId: bookingInfo.id,
                                        className: bookingInfo.className,
                                        quantity: getBookingQuantity(bookingInfo)
                                    });
                                }
                            });
                        });
                    }
                });

                myBookings.sort((a, b) => {
                    if (a.week !== b.week) return a.week - b.week;
                    if (a.dayIdx !== b.dayIdx) return a.dayIdx - b.dayIdx;
                    return periods.findIndex(p => p.id == a.periodId) - periods.findIndex(p => p.id == b.periodId);
                });
                return myBookings;
            }, [cartData, currentUser]);

            // 🔧 FIX [衝突]: cancelBookingFromList 也改用 runTransaction
            const cancelBookingFromList = (cartName, slotId, className, bookingId) => {
                showConfirm(`Are you sure you want to cancel this booking for ${cartName}?`, async () => {
                    const cartRef = dbRefs.getDocRef('carts', cartName);
                    
                    try {
                        await dbRefs.fb.runTransaction(dbRefs.db, async (transaction) => {
                            const cartDoc = await transaction.get(cartRef);
                            if (!cartDoc.exists()) throw "CART_NOT_FOUND";
                            
                            const currentSchedule = cartDoc.data().schedule || {};
                            if (!currentSchedule[slotId]) throw "ALREADY_CANCELLED";
                            const slotBookings = normalizeSlotBookings(currentSchedule[slotId]);
                            const bookingIndex = bookingId
                                ? findBookingIndex(slotBookings, bookingId)
                                : slotBookings.findIndex(booking => booking.ownerEmail === currentUser.email && booking.className === className);
                            if (bookingIndex === -1) throw "ALREADY_CANCELLED";
                            const targetBooking = slotBookings[bookingIndex];
                            
                            if (!isAdmin && targetBooking.ownerEmail !== currentUser.email) {
                                throw "NOT_OWNER";
                            }
                            
                            slotBookings.splice(bookingIndex, 1);
                            setSlotBookings(currentSchedule, slotId, slotBookings);
                            transaction.update(cartRef, { schedule: currentSchedule });
                        });
                        
                        const match = slotId.match(/w(\d+)_d(\d+)_p(\w+)/);
                        if (match) addLog("Cancel Booking", cartName, `W${match[1]} ${currentDays[parseInt(match[2])]} P${match[3]} (${className})`);
                    } catch (error) {
                        if (error === "ALREADY_CANCELLED") showAlert("這筆預約已經被取消了。");
                        else if (error === "NOT_OWNER") showAlert("你只能取消自己的預約。");
                        else if (error === "CART_NOT_FOUND") showAlert("找不到該設備。");
                        else showAlert("取消失敗，請稍後再試。");
                    }
                });
            };

            const upcomingBookings = useMemo(() =>
                allMyBookings.filter(b => !isSlotBeforeToday(b.week, b.dayIdx)),
                [allMyBookings, semesterConfig.startDate, currentRealWeek]
            );
            const historyBookings = useMemo(() =>
                allMyBookings.filter(b => isSlotBeforeToday(b.week, b.dayIdx)),
                [allMyBookings, semesterConfig.startDate, currentRealWeek]
            );
            const displayedBookings = myBookingsTab === 'upcoming' ? upcomingBookings : historyBookings;
            const openMyBooking = booking => {
                const existing = normalizeSlotBookings(cartData[booking.cartName]?.schedule?.[booking.slotId]).find(item => item.id === booking.bookingId);
                if (!existing) return showAlert('This reservation is no longer available.');
                selectWeek(booking.week);
                selectEquipment(booking.cartName);
                setMobileDay(booking.dayIdx);
                setBookingModal({ isOpen: true, dayIdx: booking.dayIdx, periodId: Number(booking.periodId), existingBooking: existing, isEditing: false, isBatch: false, isPast: isSlotBeforeToday(booking.week, booking.dayIdx) });
            };
            const renderMyBookingSlot = (dayIdx, period) => <div className="slot"><div className="slot-events">
                {displayedBookings.filter(booking => booking.week === selectedWeek && booking.dayIdx === dayIdx && Number(booking.periodId) === period.id).map(booking =>
                    <button type="button" className="booking-strip mine" key={`${booking.cartName}-${booking.bookingId}`} onClick={() => openMyBooking(booking)} title={`${booking.cartName} · ${booking.className}`}>
                        <strong>{booking.cartName} · {booking.className}</strong><small>{booking.quantity} devices</small>
                    </button>
                )}
            </div></div>;
            const selectedCartCapacity = selectedCart ? getCartCapacity(cartData[selectedCart]) : 1;
            const bookingModalSlotId = bookingModal.dayIdx !== null && bookingModal.periodId !== null
                ? `w${selectedWeek}_d${bookingModal.dayIdx}_p${bookingModal.periodId}`
                : null;
            const bookingModalAvailableQuantity = bookingModal.isBatch
                ? (batchSelection.length > 0 ? Math.min(...batchSelection.map(slot => getSlotRemainingQuantity(selectedCart, slot.slotId))) : selectedCartCapacity)
                : bookingModalSlotId
                    ? getSlotRemainingQuantity(selectedCart, bookingModalSlotId) + (bookingModal.existingBooking ? getBookingQuantity(bookingModal.existingBooking) : 0)
                    : selectedCartCapacity;
            const bookingFormData = bookingModal.isEditing ? editBookForm : bookForm;
            const setBookingFormData = bookingModal.isEditing ? setEditBookForm : setBookForm;

            const selectedPrintCarts = sortedAllCarts.filter(([name]) => printSelection.includes(name));
            const previewCartName = selectedPrintCarts.find(([name]) => name === printPreviewCart)?.[0] || selectedPrintCarts[0]?.[0];
            const previewCartIndex = selectedPrintCarts.findIndex(([name]) => name === previewCartName);
            const printReady = cartsLoaded && semesterConfigLoaded && !dataError;
            const printDocumentCarts = currentView === 'print' ? selectedPrintCarts : sortedAllCarts.filter(([name]) => name === selectedCart);
            const countWeeklyBookings = cart => currentDays.reduce((total, day, dayIdx) => total + periods.filter(period => period.id !== 'lunch').reduce((count, period) => count + normalizeSlotBookings(cart.schedule?.[`w${selectedWeek}_d${dayIdx}_p${period.id}`]).length, 0), 0);
            const renderPrintSheet = cartName => <ReservationSheet cartName={cartName} cart={cartData[cartName]} week={selectedWeek} dateRange={getWeekHeading()} options={printOptions}
                days={currentDays.map((name, dayIdx) => ({ name, date: getDateForDayIdx(selectedWeek, dayIdx) }))}
                rows={periods.map(period => ({ ...period, slots: currentDays.map((day, dayIdx) => ({
                    lock: getLockForSlot(cartName, selectedWeek, dayIdx, period.id),
                    bookings: normalizeSlotBookings(cartData[cartName]?.schedule?.[`w${selectedWeek}_d${dayIdx}_p${period.id}`])
                })) }))} />;
            const printRecords = async () => {
                if (!printReady || selectedPrintCarts.length === 0) return;
                try { await document.fonts.ready; window.print(); }
                catch (error) { showAlert('Printing is unavailable. Please try again in your browser.'); }
            };

            if (firebaseReady === 'auth-error') {
                return <div className="auth-shell"><div className="auth-content">
